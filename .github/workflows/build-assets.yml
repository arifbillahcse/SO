name: Build Vite assets

on:
  push:
    branches:
      - laravel-conversion
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip assets]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: laravel-conversion

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - name: Commit compiled assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/build
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Build Vite assets [skip assets]"
          git push origin laravel-conversion
