name: Build Vite assets

on:
  push:
    branches:
      - laravel-conversion
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip assets]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: laravel-conversion
          token: ${{ secrets.DEPLOY_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm install
        id: npm_install
        run: npm install 2>&1 | tee /tmp/npm-install.log
        continue-on-error: true

      - name: npm run build
        id: npm_build
        if: steps.npm_install.outcome == 'success'
        run: npm run build 2>&1 | tee /tmp/npm-build.log
        continue-on-error: true

      - name: Report failure as commit comment
        if: steps.npm_install.outcome == 'failure' || steps.npm_build.outcome == 'failure'
        run: |
          {
            echo "### Build Vite assets failed"
            echo '```'
            tail -n 100 /tmp/npm-install.log /tmp/npm-build.log 2>/dev/null
            echo '```'
          } > /tmp/comment.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body=@/tmp/comment.md
          exit 1
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Commit compiled assets
        id: commit_assets
        if: steps.npm_build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/build
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Build Vite assets [skip assets]"
          git push origin laravel-conversion 2>&1 | tee /tmp/push.log
        continue-on-error: true

      - name: Report push failure as commit comment
        if: steps.commit_assets.outcome == 'failure'
        run: |
          {
            echo "### Pushing compiled assets failed"
            echo '```'
            cat /tmp/push.log 2>/dev/null
            echo '```'
          } > /tmp/comment2.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body=@/tmp/comment2.md
          exit 1
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
