; Softorio — queue worker (processes queued emails from the contact
; and affiliate forms; see app/Mail/*.php, all implement ShouldQueue)
;
; Install: copy to /etc/supervisor/conf.d/softorio-worker.conf, then:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start softorio-worker:*

[program:softorio-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/softorio/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/softorio
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/softorio/storage/logs/worker.log
stopwaitsecs=3600
