# Softorio — Nginx server block
#
# Adjust `server_name`, `root`, and PHP-FPM socket path for your actual
# server before using. Place at /etc/nginx/sites-available/softorio.conf
# and symlink into sites-enabled, or drop into cPanel's custom Nginx
# config include if that's how this server is managed.

server {
    listen 80;
    listen [::]:80;
    server_name softorio.com www.softorio.com;

    # Redirect everything to HTTPS once the cert is issued (Step 1 in
    # deploy/DEPLOYMENT.md). Comment this out for the very first
    # deploy if certbot needs to serve the HTTP-01 challenge first.
    return 301 https://softorio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.softorio.com;

    ssl_certificate     /etc/letsencrypt/live/softorio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softorio.com/privkey.pem;

    # Canonical host — redirect www to apex (or flip this if you'd
    # rather canonicalize to www).
    return 301 https://softorio.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name softorio.com;

    root /var/www/softorio/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/softorio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softorio.com/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    access_log /var/log/nginx/softorio-access.log;
    error_log  /var/log/nginx/softorio-error.log;

    # Never serve dotfiles (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Long cache for Vite's versioned build assets; everything else
    # in public/ (favicon, robots.txt) stays unhinted.
    location ^~ /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
